services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: researcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: loanrisk
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcher -d loanrisk"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://researcher:${POSTGRES_PASSWORD}@postgres:5432/loanrisk
      API_KEY: ${API_KEY:?Set a strong API_KEY}
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - analytical-data:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
volumes:
  postgres-data:
  analytical-data:
